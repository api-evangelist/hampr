aid: hampr
name: hampr
description: >-
  hampr is an app-based, on-demand laundry pickup and delivery service founded
  by Laurel Hess and backed by Techstars. Members bag their dirty laundry, tap
  the hampr mobile app, and a local independent "washr" collects, professionally
  washes, dries, folds, and returns it to their door within 24 hours at flat-rate
  per-load pricing with free pickup and delivery. hampr operates across 16+ US
  states with 1,500+ washrs, 11,000+ members, and 300,000+ loads completed, and
  also runs hampr for business, a commercial laundry solution for salons, spas,
  gyms, and short-term rentals. This profile was surfaced as a Techstars
  portfolio lead and enriched by the API Evangelist pipeline; hampr is a
  consumer/commercial mobile service and publishes no public developer API.
